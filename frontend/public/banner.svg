<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0"/>
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="500" r="400" fill="url(#glowTeal)" />
  <circle cx="1000" cy="150" r="500" fill="url(#glowGold)" />

  <!-- Decorative Grid / Net -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Logo Mark -->
  <g transform="translate(100, 160)">
    <!-- Outer Shield Path -->
    <path d="M125 40 L60 60 V120 C60 170 85 205 125 220 C165 205 190 170 190 120 V60 Z" 
          fill="rgba(15,23,42,0.8)" stroke="url(#textGrad)" stroke-width="6" stroke-linejoin="round" filter="url(#softGlow)"/>
    <circle cx="125" cy="120" r="22" fill="none" stroke="#fcd34d" stroke-width="6" />
    <circle cx="125" cy="120" r="8" fill="#f59e0b" filter="url(#softGlow)"/>
    <!-- Nodes -->
    <circle cx="102" cy="97" r="4" fill="#fcd34d" />
    <circle cx="148" cy="97" r="4" fill="#fcd34d" />
    <circle cx="102" cy="143" r="4" fill="#fcd34d" />
    <circle cx="148" cy="143" r="4" fill="#fcd34d" />
    <!-- Lines -->
    <line x1="106" y1="101" x2="119" y2="114" stroke="#fcd34d" stroke-width="2" />
    <line x1="144" y1="101" x2="131" y2="114" stroke="#fcd34d" stroke-width="2" />
    <line x1="106" y1="139" x2="119" y2="126" stroke="#fcd34d" stroke-width="2" />
    <line x1="144" y1="139" x2="131" y2="126" stroke="#fcd34d" stroke-width="2" />
  </g>

  <!-- Text -->
  <text x="320" y="270" font-family="Outfit, sans-serif" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">PrivacyGuard</text>
  
  <text x="325" y="350" font-family="Inter, sans-serif" font-size="42" font-weight="300" fill="#94a3b8">
    Verify Claims.
  </text>
  <text x="590" y="350" font-family="Inter, sans-serif" font-size="42" font-weight="600" fill="url(#textGrad)">
    Reveal Nothing.
  </text>

  <!-- Tag / Badge -->
  <rect x="325" y="420" width="340" height="50" rx="25" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="2" />
  <text x="350" y="452" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#fcd34d" letter-spacing="1">
    POWERED BY MIDNIGHT NETWORK
  </text>
  
  <!-- Right Side Abstract UI Elements -->
  <g transform="translate(850, 180)" filter="url(#softGlow)">
    <rect x="0" y="0" width="220" height="180" rx="16" fill="rgba(30,41,59,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    <rect x="20" y="30" width="120" height="12" rx="6" fill="rgba(255,255,255,0.1)" />
    <rect x="20" y="60" width="180" height="8" rx="4" fill="rgba(255,255,255,0.05)" />
    <rect x="20" y="80" width="150" height="8" rx="4" fill="rgba(255,255,255,0.05)" />
    <rect x="20" y="120" width="80" height="30" rx="8" fill="rgba(20,184,166,0.2)" />
    <text x="40" y="140" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#2dd4bf">VERIFIED</text>
  </g>
</svg>
