<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" fill="url(#gradBg)" rx="100" />
  
  <!-- Outer Shield Path -->
  <path d="M250 80 L120 120 V240 C120 340 170 410 250 440 C330 410 380 340 380 240 V120 Z" 
        fill="none" stroke="url(#grad1)" stroke-width="15" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Inner Elements -->
  <circle cx="250" cy="240" r="45" fill="none" stroke="#fcd34d" stroke-width="12" />
  
  <!-- ZK Nodes / Constellation -->
  <circle cx="250" cy="240" r="16" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="205" cy="195" r="8" fill="#fcd34d" />
  <circle cx="295" cy="195" r="8" fill="#fcd34d" />
  <circle cx="205" cy="285" r="8" fill="#fcd34d" />
  <circle cx="295" cy="285" r="8" fill="#fcd34d" />
  <circle cx="250" cy="170" r="10" fill="#f59e0b" />
  
  <!-- Connecting lines -->
  <line x1="211" y1="201" x2="238" y2="228" stroke="#fcd34d" stroke-width="3" />
  <line x1="289" y1="201" x2="262" y2="228" stroke="#fcd34d" stroke-width="3" />
  <line x1="211" y1="279" x2="238" y2="252" stroke="#fcd34d" stroke-width="3" />
  <line x1="289" y1="279" x2="262" y2="252" stroke="#fcd34d" stroke-width="3" />
  <line x1="250" y1="180" x2="250" y2="224" stroke="#fcd34d" stroke-width="3" />
</svg>
